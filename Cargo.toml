[workspace]
members = ["confex-core", "confex-macros"]
resolver = "2"

[package]
name = "confex"
version = "0.1.0"
edition = "2024"

[features]
default = ["sqlite-backend", "hot-reload", "toml"]
sqlite-backend = ["confex-core/sqlite-backend"]
hot-reload = ["confex-core/hot-reload"]
native-keyring = ["confex-core/native-keyring"]
sealed-key = ["confex-core/sealed-key"]
async = ["confex-core/async"]
json = ["confex-core/json"]
toml = ["confex-core/toml"]

[dependencies]
confex-core = { path = "confex-core" }
confex-macros = { path = "confex-macros" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
