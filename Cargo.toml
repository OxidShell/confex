[workspace]
members = ["confex-core", "confex-macros"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OxidShell/confex"
# redb 5 requires 1.90.
rust-version = "1.90"

[package]
name = "confex"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Layered config library - merges files, env vars, CLI, and a redb-backed dconf-like store into a typed struct with selective per-source hot-reload"
keywords = ["config", "configuration", "hot-reload", "toml", "redb"]
categories = ["config", "filesystem"]
readme = "README.md"

[features]
default = ["macros", "redb-backend", "hot-reload", "toml"]
macros = ["dep:confex-macros"]
redb-backend = ["confex-core/redb-backend"]
hot-reload = ["confex-core/hot-reload"]
native-keyring = ["confex-core/native-keyring"]
sealed-key = ["confex-core/sealed-key"]
async = ["confex-core/async"]
json = ["confex-core/json"]
toml = ["confex-core/toml"]
istmo = ["confex-core/istmo"]
sismo = ["confex-core/sismo"]

[dependencies]
confex-core = { path = "confex-core", version = "0.1" }
confex-macros = { path = "confex-macros", version = "0.1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[[example]]
name = "async_loader"
required-features = ["async"]

[[example]]
name = "sealed_key"
required-features = ["sealed-key"]
