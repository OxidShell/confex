[package]
name = "confex-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Core engine for confex - source merging, hot-reload, migrations, and encryption"
keywords = ["config", "configuration", "hot-reload", "toml", "sqlite"]
categories = ["config", "filesystem"]

[features]
sqlite-backend = ["dep:rusqlite"]
bundled-sqlite = ["rusqlite/bundled"]
hot-reload = ["dep:notify"]
native-keyring = ["dep:zbus", "dep:security-framework", "dep:windows"]
sealed-key = ["dep:argon2"]
async = []
json = ["dep:serde_json"]
toml = ["dep:toml"]

[dependencies]
serde = "1"
serde_json = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
arc-swap = "1"
tracing = "0.1"
rusqlite = { version = "0.32", optional = true }
notify = { version = "6", optional = true }
argon2 = { version = "0.5", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", features = ["blocking"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Credentials",
    "Win32_Foundation",
], optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tempfile = "3"
