[package]
name = "confex-core"
version = "0.1.0"
edition = "2024"

[features]
sqlite-backend = ["dep:rusqlite"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
tempfile = "3"
